# Category 4 platform.yaml — example-nginx-bs
# Uses wreed4/example-helm (nginx) to test the Cat 4 virtual variant.
#
# ArgoCD pulls directly from https://github.com/wreed4/example-helm,
# so branch manipulation here is fully visible to ArgoCD without touching
# the acd repo.
#
# App names (service=example-nginx-bs, 16 chars):
#   - example-nginx-bs-dev             (dev, default branch)
#   - example-nginx-bs-virtual         (virtual, default branch — Mode A)
#   - example-nginx-bs-virt-<slug>     would exceed 25 chars, use appNameOverride or shorten
#
# NOTE: "example-nginx-bs" = 16 chars. "-virtual" = 8. Total = 24. Safe (limit 25).
#       On a PR branch the slug is appended: must stay ≤ 25 total.
#       For long branch names ACD truncates the slug to fit.

service: example-nginx-bs
project: kaas
owner: kaas-team

base:
  standard:
    type: bootstrap
    version: wil-vcluster
    values:
      targetNamespace: example-nginx-bs
      repoURL: https://github.com/wreed4/example-helm
      path: "."
      clusterTypes: ["internal"]
      valueFiles:
        - values.yaml
      syncPolicy:
        automated:
          prune: true
          selfHeal: true

variants:
  - name: dev
    overrides:
      standard:
        values:
          targetRevision: master

  - name: qa
    overrides:
      standard:
        version: v1-qa
        values:
          targetRevision: master

  # virtual: per-PR vCluster testing.
  #
  # ACD injects all virtualMode.* fields automatically — do NOT set them here.
  #
  # Mode A (master branch):
  #   ApplicationSet matches all vClusters (acd.acquia.io/virtual=true),
  #   excluding vClusters owned by this service's own PRs.
  #
  # Mode B (feature branch):
  #   ACD provisions vCluster "vc-example-nginx-bs-<branch-slug>",
  #   registers it with ArgoCD, deploys this chart at the PR branch,
  #   and cleans up on deletion (PR close).
  #
  # To simulate a PR: create a branch on wreed4/example-helm, then run:
  #   acd deploy --platform /path/to/example-helm/platform.yaml --variant virtual
  - name: virtual
    overrides:
      standard:
        values:
          targetRevision: master # ACD overrides this with the actual branch in Mode B
          clusterTypes: ["internal"]
          valueFiles:
            - values.yaml
          dependencies:
            - example-nginx-2

  - name: staging
    overrides:
      standard:
        version: v1-staging
        values:
          targetRevision: master

  - name: prod
    overrides:
      standard:
        version: v1-prod
        values:
          targetRevision: master
